const uid = () => Math.random().toString(36).slice(2, 10);

async function storageGet(key) {
  const v = localStorage.getItem(key);
  return v === null ? null : { value: v };
}
async function storageSet(key, value) {
  localStorage.setItem(key, value);
  return { value };
}

// migra vecchi formati verso: day -> sections[] -> { subtitle, exercises[] }
function migrateSection(section) {
  return { id: section.id || uid(), subtitle: section.subtitle || "", exercises: section.exercises || [] };
}
function migrateDay(day) {
  if (day.sections) return { ...day, sections: day.sections.map(migrateSection) };
  return { id: day.id, name: day.name, sections: [{ id: uid(), subtitle: "", exercises: day.exercises || [] }] };
}
function migratePlan(plan) {
  return { days: (plan.days || []).map(migrateDay) };
}

function useBeep() {
  const ctxRef = useRef(null);
  return useCallback(() => {
    try {
      if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = ctxRef.current;
      [0, 0.18, 0.36].forEach((t, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.value = i === 2 ? 1046 : 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.16);
      });
    } catch (e) {}
  }, []);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, "0")}`;
}
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
}

  const [history, setHistory] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    (async () => {
      try {
        let p = await storageGet(PLAN_KEY);
        if (!p) {
          for (const oldKey of OLD_PLAN_KEYS) {
            const old = await storageGet(oldKey);
            if (old) { p = { value: JSON.stringify(migratePlan(JSON.parse(old.value))) }; break; }
          }
        }
        const h = await storageGet(HISTORY_KEY);
        if (p) setPlan(migratePlan(JSON.parse(p.value)));
        if (h) setHistory(JSON.parse(h.value));
      } catch (e) {
        setError("Impossibile caricare i dati salvati.");
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    storageSet(PLAN_KEY, JSON.stringify(plan)).catch(() => setError("Salvataggio scheda non riuscito."));
  }, [plan, loaded]);

  useEffect(() => {
    if (!loaded) return;
    storageSet(HISTORY_KEY, JSON.stringify(history)).catch(() => setError("Salvataggio storico non riuscito."));
  }, [history, loaded]);

  const lastEntryFor = useCallback(
    (exerciseId) => {
      for (let i = history.length - 1; i >= 0; i--) {
        const e = history[i].entries.find((x) => x.exerciseId === exerciseId);

      return null;

      </main>

      <nav style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#191a1e", borderTop: "1px solid #24262b", display: "flex", padding: "8px calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))", justifyContent: "center", gap: 8 }}>
        <div style={{ display: "flex", gap: 6, maxWidth: 480, width: "100%" }}>
          <NavBtn active={view === "scheda"} onClick={() => setView("scheda")} icon={<ClipboardList size={20} />} label="Scheda" />
          <NavBtn active={view === "allenamento"} onClick={() => setView("allenamento")} icon={<Flame size={20} />} label="Allenamento" />
          <NavBtn active={view === "storico"} onClick={() => setView("storico")} icon={<HistoryIcon size={20} />} label="Storico" />
        </div>
      </nav>
    </div>
  );
}

function NavBtn({ active, onClick, icon, label }) {
  return (
    <button className="tap" onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "8px 4px", borderRadius: 10, border: "none", background: active ? "#232520" : "transparent", color: active ? "#F2C14E" : "#8B8D94", cursor: "pointer" }}>
      {icon}
      <span style={{ fontSize: 11, fontWeight: 500 }}>{label}</span>
    </button>
  );
}

/* ---------------- SCHEDA ---------------- */

function SchedaView({ plan, setPlan }) {
  const [newDayName, setNewDayName] = useState("");
  const addDay = () => {
    const name = newDayName.trim();
    if (!name) return;
    const day = { id: uid(), name, sections: [{ id: uid(), subtitle: "", exercises: [] }] };
    setPlan((p) => ({ ...p, days: [...p.days, day] }));
    setNewDayName("");
  };
  const removeDay = (dayId) => setPlan((p) => ({ ...p, days: p.days.filter((d) => d.id !== dayId) }));

  if (plan.days.length === 0) {
    return (
      <div>
        <EmptyState title="Crea la tua scheda" body="Dividi l'allenamento in giornate, poi aggiungi sezioni con sottotitolo ed esercizi. Il tempo di recupero che imposti per ogni esercizio avvia in automatico il timer durante l'allenamento." />
        <AddDayForm value={newDayName} setValue={setNewDayName} onAdd={addDay} />
      </div>
    );
  }
  return (
    <div>
      {plan.days.map((day) => <DayCard key={day.id} day={day} setPlan={setPlan} onRemove={() => removeDay(day.id)} />)}
      <AddDayForm value={newDayName} setValue={setNewDayName} onAdd={addDay} />
    </div>
  );
}

function AddDayForm({ value, setValue, onAdd }) {
  return (
    <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
      <input value={value} onChange={(e) => setValue(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onAdd()} placeholder="Nome giornata (es. Giorno 1)" style={inputStyle} />
      <button className="tap" onClick={onAdd} style={primaryBtnStyle}><Plus size={18} /></button>
    </div>
  );
}

function DayCard({ day, setPlan, onRemove }) {
  const [expanded, setExpanded] = useState(true);
  const updateDay = (fn) => setPlan((p) => ({ ...p, days: p.days.map((d) => (d.id === day.id ? fn(d) : d)) }));

  const addSection = () => updateDay((d) => ({ ...d, sections: [...d.sections, { id: uid(), subtitle: "", exercises: [] }] }));
  const removeSection = (sectionId) => updateDay((d) => ({ ...d, sections: d.sections.filter((s) => s.id !== sectionId) }));
  const setSubtitle = (sectionId, value) => updateDay((d) => ({ ...d, sections: d.sections.map((s) => (s.id === sectionId ? { ...s, subtitle: value } : s)) }));
  const addExercise = (sectionId, ex) => updateDay((d) => ({ ...d, sections: d.sections.map((s) => (s.id === sectionId ? { ...s, exercises: [...s.exercises, ex] } : s)) }));
  const removeExercise = (sectionId, exId) => updateDay((d) => ({ ...d, sections: d.sections.map((s) => (s.id === sectionId ? { ...s, exercises: s.exercises.filter((e) => e.id !== exId) } : s)) }));

  const totalExercises = day.sections.reduce((n, s) => n + s.exercises.length, 0);

  return (
    <div style={{ ...cardStyle, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer" }} onClick={() => setExpanded((v) => !v)}>
        <h2 className="bn" style={{ fontSize: 22, margin: 0, color: "#F2C14E" }}>{day.name}</h2>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 12, color: "#8B8D94" }}>{totalExercises} esercizi</span>
          <button className="tap" onClick={(e) => { e.stopPropagation(); onRemove(); }} style={iconBtnStyle}><Trash2 size={16} color="#D96E6E" /></button>
        </div>
      </div>

      {expanded && (
        <div style={{ marginTop: 14 }}>
          {day.sections.map((section, idx) => (
            <SectionBlock
              key={section.id}
              section={section}
              index={idx}
              canRemove={day.sections.length > 1}
              onRemove={() => removeSection(section.id)}
              onSubtitleChange={(v) => setSubtitle(section.id, v)}
              onAddExercise={(ex) => addExercise(section.id, ex)}
              onRemoveExercise={(exId) => removeExercise(section.id, exId)}
            />
          ))}
          <button className="tap" onClick={addSection} style={{ ...secondaryBtnStyle, width: "100%", marginTop: 4 }}>
            <Layers size={15} /> Aggiungi sezione
          </button>
        </div>
      )}
    </div>
  );
}

function normalizeSearch(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function ExerciseAutocomplete({ value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    function onOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onOutside);
    document.addEventListener("touchstart", onOutside);
    return () => {
      document.removeEventListener("mousedown", onOutside);
      document.removeEventListener("touchstart", onOutside);
    };
  }, []);

  const words = normalizeSearch((value || "").trim()).split(/\s+/).filter(Boolean);
  const results = words.length === 0
    ? EXERCISE_DB
    : EXERCISE_DB.filter((ex) => {
        const name = normalizeSearch(ex.n);
        return words.every((w) => name.includes(w));
      });

  return (
    <div ref={wrapRef} style={{ position: "relative", marginBottom: 8 }}>
      <div style={{ position: "relative" }}>
        <input
          value={value}
          onChange={(e) => onChange(e.target.value)}
          onFocus={() => setOpen(true)}
          placeholder={placeholder}
          style={{ ...inputStyle, paddingRight: 30 }}
        />
        <Search size={14} color="#5F6067" style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }} />
      </div>
      {open && (
        <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, maxHeight: 260, overflowY: "auto", background: "#15161a", border: "1px solid #2c2e33", borderRadius: 8, zIndex: 20, boxShadow: "0 10px 28px rgba(0,0,0,0.45)" }}>
          {results.length === 0 ? (
            <div style={{ padding: "10px 12px", fontSize: 12.5, color: "#5F6067", lineHeight: 1.4 }}>
              Nessun esercizio trovato nel database. Puoi comunque aggiungerlo con il nome scritto sopra.
            </div>
          ) : (
            results.map((ex, i) => (
              <div
                key={i}
                onClick={() => { onChange(ex.n); setOpen(false); }}
                className="tap"
                style={{ padding: "9px 12px", fontSize: 13.5, cursor: "pointer", borderBottom: i < results.length - 1 ? "1px solid #202226" : "none", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}
              >
                <span>{ex.n}</span>
                <span style={{ fontSize: 10, color: "#5F6067", flexShrink: 0, whiteSpace: "nowrap" }}>{ex.c}</span>
              </div>
            ))
          )}
        </div>
      )}
    </div>
  );
}

function SectionBlock({ section, index, canRemove, onRemove, onSubtitleChange, onAddExercise, onRemoveExercise }) {
  const [form, setForm] = useState({ name: "", sets: 3, reps: "8-12", rest: 90 });

  const submitExercise = () => {
    const name = form.name.trim();
    if (!name) return;
    onAddExercise({ id: uid(), name, sets: Math.max(1, Number(form.sets) || 1), reps: form.reps.trim() || "-", rest: Math.max(0, Number(form.rest) || 0) });
    setForm({ name: "", sets: 3, reps: "8-12", rest: 90 });
  };

  return (
    <div style={{ background: "#15161a", border: "1px solid #24262b", borderRadius: 10, padding: 12, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <input
          value={section.subtitle}
          onChange={(e) => onSubtitleChange(e.target.value)}
          placeholder={`Sottotitolo sezione ${index + 1} (es. Petto) — opzionale`}
          style={{ ...inputStyle, fontWeight: 600, flex: 1 }}
        />
        {canRemove && (
          <button className="tap" onClick={onRemove} style={iconBtnStyle}><Trash2 size={15} color="#5F6067" /></button>
        )}
      </div>

      {section.exercises.map((ex) => (
        <div key={ex.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderTop: "1px solid #24262b" }}>
          <div>
            <div style={{ fontWeight: 600, fontSize: 15 }}>{ex.name}</div>
            <div style={{ fontSize: 12, color: "#8B8D94", marginTop: 2, display: "flex", alignItems: "center", gap: 4 }}>
              {ex.sets} serie &middot; {ex.reps} rip &middot; <TimerIcon size={11} /> {ex.rest}s recupero
            </div>
          </div>
          <button className="tap" onClick={() => onRemoveExercise(ex.id)} style={iconBtnStyle}><Trash2 size={15} color="#5F6067" /></button>
        </div>
      ))}


      <div style={{ marginTop: 10, background: "#191a1e", borderRadius: 8, padding: 12 }}>
        <ExerciseAutocomplete value={form.name} onChange={(v) => setForm((f) => ({ ...f, name: v }))} placeholder="Cerca o scrivi un esercizio..." />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
          <LabeledInput label="Serie" value={form.sets} onChange={(v) => setForm((f) => ({ ...f, sets: v }))} type="number" />
          <LabeledInput label="Rip" value={form.reps} onChange={(v) => setForm((f) => ({ ...f, reps: v }))} />
          <LabeledInput label="Recupero (s)" value={form.rest} onChange={(v) => setForm((f) => ({ ...f, rest: v }))} type="number" />
        </div>
        <button className="tap" onClick={submitExercise} style={{ ...primaryBtnStyle, width: "100%", marginTop: 10 }}><Plus size={16} /> Aggiungi esercizio</button>
      </div>
    </div>
  );
}

function LabeledInput({ label, value, onChange, type = "text" }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontSize: 11, color: "#8B8D94" }}>{label}</span>
      <input type={type} value={value} onChange={(e) => onChange(e.target.value)} style={inputStyle} />
    </label>
  );
}

/* ---------------- ALLENAMENTO ---------------- */

function AllenamentoView({ plan, history, setHistory, lastEntryFor }) {
  const [session, setSession] = useState(null);
  const [timer, setTimer] = useState(null); // timer di recupero (globale, tra le serie)
  const intervalRef = useRef(null);
  const beep = useBeep();

  useEffect(() => {
    if (timer && timer.running) {
      intervalRef.current = setInterval(() => {
        setTimer((t) => {
          if (!t) return t;
          if (t.remaining <= 1) { beep(); return { ...t, remaining: 0, running: false }; }
          return { ...t, remaining: t.remaining - 1 };
        });
      }, 1000);
      return () => clearInterval(intervalRef.current);
    }
  }, [timer && timer.running, timer && timer.total]);

  if (plan.days.length === 0) return <EmptyState title="Nessuna scheda" body="Vai su Scheda e crea prima una giornata di allenamento." />;

  if (!session) {
    return (
      <div>
        <p style={{ color: "#8B8D94", fontSize: 14, marginBottom: 14 }}>Scegli la giornata da allenare oggi.</p>
        {plan.days.map((day) => {
          const totalExercises = day.sections.reduce((n, s) => n + s.exercises.length, 0);
          return (
            <button key={day.id} className="tap" onClick={() => {
              const sections = day.sections.map((section) => ({
                id: section.id,
                subtitle: section.subtitle,
                exerciseEntries: section.exercises.map((ex) => {
                  const last = lastEntryFor(ex.id);
                  return {
                    exerciseId: ex.id, name: ex.name, subtitle: section.subtitle, rest: ex.rest,
                    sets: Array.from({ length: ex.sets }, (_, i) => ({ weight: last && last.sets[i] ? last.sets[i].weight : "", reps: "", done: false })),
                  };
                }),
              }));
              setSession({ dayId: day.id, dayName: day.name, sections });
            }} style={{ ...cardStyle, width: "100%", textAlign: "left", marginBottom: 10, display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer" }}>
              <div>
                <div className="bn" style={{ fontSize: 20, color: "#F2C14E" }}>{day.name}</div>
                <div style={{ fontSize: 12, color: "#8B8D94" }}>{totalExercises} esercizi</div>
              </div>
              <ChevronRight size={20} color="#5F6067" />
            </button>
          );
        })}
      </div>
    );
  }

  const startTimer = (seconds, label) => { if (seconds <= 0) return; setTimer({ total: seconds, remaining: seconds, running: true, label }); };
  const setSet = (exerciseId, idx, field, value) => setSession((s) => ({ ...s, sections: s.sections.map((sec) => ({ ...sec, exerciseEntries: sec.exerciseEntries.map((e) => e.exerciseId !== exerciseId ? e : { ...e, sets: e.sets.map((st, i) => (i === idx ? { ...st, [field]: value } : st)) }) })) }));
  const toggleDone = (exerciseId, idx, rest) => {
    const currentEntry = session.sections.flatMap((sec) => sec.exerciseEntries).find((e) => e.exerciseId === exerciseId);
    const willBeDone = !currentEntry.sets[idx].done;
    setSession((s) => ({ ...s, sections: s.sections.map((sec) => ({ ...sec, exerciseEntries: sec.exerciseEntries.map((e) => e.exerciseId !== exerciseId ? e : { ...e, sets: e.sets.map((st, i) => (i === idx ? { ...st, done: !st.done } : st)) }) })) }));
    if (willBeDone) startTimer(rest, "Recupero");
  };
  const finishSession = () => {
    const entries = session.sections.flatMap((sec) => sec.exerciseEntries)
      .map((e) => ({ exerciseId: e.exerciseId, name: e.name, subtitle: e.subtitle, sets: e.sets.filter((s) => s.weight !== "" || s.reps !== "").map((s) => ({ weight: s.weight, reps: s.reps })) }))
      .filter((e) => e.sets.length > 0);
    if (entries.length > 0) setHistory((h) => [...h, { id: uid(), date: new Date().toISOString(), dayId: session.dayId, dayName: session.dayName, entries }]);
    setSession(null); setTimer(null);
  };

  return (
    <div>
      {timer && <RestTimer timer={timer} onPause={() => setTimer((t) => ({ ...t, running: !t.running }))} onAdjust={(d) => setTimer((t) => ({ ...t, remaining: Math.max(0, t.remaining + d), total: Math.max(t.total, t.remaining + d) }))} onClose={() => setTimer(null)} />}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <h2 className="bn" style={{ fontSize: 24, margin: 0, color: "#F2C14E" }}>{session.dayName}</h2>
        <button className="tap" onClick={() => { if (window.confirm("Interrompere l'allenamento senza salvare?")) { setSession(null); setTimer(null); } }} style={{ ...iconBtnStyle, color: "#8B8D94" }}><X size={18} /></button>
      </div>

      {session.sections.map((sec) => (
        <div key={sec.id}>
          {sec.subtitle && (
            <div className="bn" style={{ fontSize: 15, color: "#8B8D94", margin: "14px 0 8px", letterSpacing: "0.06em", textTransform: "uppercase" }}>{sec.subtitle}</div>
          )}
          {sec.exerciseEntries.map((e) => (
            <div key={e.exerciseId} style={{ ...cardStyle, marginBottom: 12 }}>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10 }}>
                <span style={{ fontWeight: 600, fontSize: 15 }}>{e.name}</span>
                <span style={{ fontSize: 11, color: "#8B8D94", display: "flex", alignItems: "center", gap: 4 }}><ClockIcon size={12} /> {e.rest}s</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "24px 1fr 1fr 32px", gap: 8, alignItems: "center", marginBottom: 6 }}>
                <span></span><span style={{ fontSize: 11, color: "#5F6067" }}>Kg</span><span style={{ fontSize: 11, color: "#5F6067" }}>Rip</span><span></span>
              </div>
              {e.sets.map((st, idx) => (
                <div key={idx} style={{ display: "grid", gridTemplateColumns: "24px 1fr 1fr 32px", gap: 8, alignItems: "center", marginBottom: 6 }}>
                  <span style={{ fontSize: 13, color: "#8B8D94", textAlign: "center" }}>{idx + 1}</span>
                  <input value={st.weight} onChange={(ev) => setSet(e.exerciseId, idx, "weight", ev.target.value)} inputMode="decimal" placeholder="0" style={{ ...inputStyle, textAlign: "center", padding: "8px 6px", opacity: st.done ? 0.6 : 1 }} />
                  <input value={st.reps} onChange={(ev) => setSet(e.exerciseId, idx, "reps", ev.target.value)} inputMode="numeric" placeholder="0" style={{ ...inputStyle, textAlign: "center", padding: "8px 6px", opacity: st.done ? 0.6 : 1 }} />
                  <button className="tap" onClick={() => toggleDone(e.exerciseId, idx, e.rest)} style={{ width: 32, height: 32, borderRadius: 8, border: "none", background: st.done ? "#3FA772" : "#24262b", color: st.done ? "#0D2417" : "#5F6067", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><Check size={16} /></button>
                </div>
              ))}
            </div>
          ))}
        </div>
      ))}

      <button className="tap" onClick={finishSession} style={{ ...primaryBtnStyle, width: "100%", padding: "14px", fontSize: 15 }}>Termina allenamento</button>
    </div>
  );
}

function RestTimer({ timer, onPause, onAdjust, onClose }) {
  const pct = timer.total > 0 ? timer.remaining / timer.total : 0;
  const r = 42, circ = 2 * Math.PI * r;
  const finished = timer.remaining === 0;
  return (
    <div style={{ position: "sticky", top: 8, zIndex: 5, background: "#191a1e", border: "1px solid #24262b", borderRadius: 14, padding: "14px 16px", display: "flex", alignItems: "center", gap: 14, marginBottom: 16 }}>
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r={r} fill="none" stroke="#24262b" strokeWidth="8" />
        <circle cx="48" cy="48" r={r} fill="none" stroke={finished ? "#3FA772" : "#F2C14E"} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round" transform="rotate(-90 48 48)" style={{ transition: "stroke-dashoffset 1s linear" }} />
        <text x="48" y="53" textAnchor="middle" fontSize="20" fontWeight="600" fill="#EDEBE3">{formatTime(timer.remaining)}</text>
      </svg>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 13, color: "#8B8D94", marginBottom: 8 }}>{finished ? "Recupero finito" : timer.label}</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="tap" onClick={() => onAdjust(-15)} style={smallBtnStyle}>-15s</button>
          <button className="tap" onClick={() => onAdjust(15)} style={smallBtnStyle}>+15s</button>
          <button className="tap" onClick={onPause} style={smallBtnStyle}>{timer.running ? <Pause size={14} /> : <Play size={14} />}</button>
          <button className="tap" onClick={onClose} style={smallBtnStyle}><X size={14} /></button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- STORICO ---------------- */

function groupBySubtitle(entries) {
  const groups = [];
  entries.forEach((e) => {
    const sub = e.subtitle || "";
    const last = groups[groups.length - 1];
    if (last && last.subtitle === sub) last.items.push(e);
    else groups.push({ subtitle: sub, items: [e] });
  });
  return groups;
}

function StoricoView({ history, setHistory, plan }) {
  const [expandedId, setExpandedId] = useState(null);
  const allExercises = [];
  const seen = new Set();
  plan.days.forEach((d) => d.sections.forEach((s) => s.exercises.forEach((e) => { if (!seen.has(e.id)) { seen.add(e.id); allExercises.push(e); } })));
  const [progressExId, setProgressExId] = useState(allExercises[0]?.id || "");
  const [zoomSessionId, setZoomSessionId] = useState(null);

  if (history.length === 0) return <EmptyState title="Nessun allenamento registrato" body="Le sessioni completate compariranno qui, con i pesi usati e l'andamento nel tempo." />;

  const progressData = history.map((s) => {
    const e = s.entries.find((x) => x.exerciseId === progressExId);
    if (!e) return null;
    const weights = e.sets.map((st) => parseFloat(st.weight)).filter((w) => !isNaN(w));
    if (weights.length === 0) return null;
    return { sessionId: s.id, date: s.date, max: Math.max(...weights) };
  }).filter(Boolean);

  const zoomedSession = zoomSessionId ? history.find((s) => s.id === zoomSessionId) : null;
  const zoomedEntry = zoomedSession ? zoomedSession.entries.find((x) => x.exerciseId === progressExId) : null;

  const removeSession = (id) => setHistory((h) => h.filter((s) => s.id !== id));

  return (
    <div>
      {allExercises.length > 0 && (
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <BarChart3 size={16} color="#F2C14E" />
            <span style={{ fontWeight: 600, fontSize: 14 }}>Progressi peso</span>
          </div>
          <select value={progressExId} onChange={(e) => { setProgressExId(e.target.value); setZoomSessionId(null); }} style={{ ...inputStyle, marginBottom: 12 }}>
            {allExercises.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
          </select>
          {zoomedEntry ? (
            <div>
              <button className="tap" onClick={() => setZoomSessionId(null)} style={{ ...smallBtnStyle, display: "flex", alignItems: "center", gap: 4, marginBottom: 10, background: "transparent", color: "#F2C14E", padding: "4px 2px" }}>
                <ChevronLeft size={14} color="#F2C14E" /> Torna alla panoramica
              </button>
              <div style={{ fontSize: 12, color: "#8B8D94", marginBottom: 8 }}>{zoomedSession.dayName} · {formatDate(zoomedSession.date)} — andamento serie per serie</div>
              <SetDetailChart entry={zoomedEntry} />
            </div>
          ) : progressData.length === 0 ? (
            <p style={{ fontSize: 13, color: "#8B8D94" }}>Nessun dato per questo esercizio.</p>
          ) : (
            <div>
              <MiniChart data={progressData} onSelectPoint={(id) => setZoomSessionId(id)} />
              {progressData.length > 1 && <div style={{ fontSize: 11, color: "#5F6067", marginTop: 6, textAlign: "center" }}>Tocca un punto per vedere l'andamento serie per serie di quel giorno</div>}
            </div>
          )}
        </div>
      )}
      {[...history].reverse().map((s) => {
        const groups = groupBySubtitle(s.entries);
        return (
          <div key={s.id} style={{ ...cardStyle, marginBottom: 10 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer" }} onClick={() => setExpandedId(expandedId === s.id ? null : s.id)}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 15 }}>{s.dayName}</div>
                <div style={{ fontSize: 12, color: "#8B8D94" }}>{formatDate(s.date)}</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <button className="tap" onClick={(e) => { e.stopPropagation(); if (window.confirm("Eliminare questa sessione dallo storico?")) removeSession(s.id); }} style={iconBtnStyle}><Trash2 size={15} color="#5F6067" /></button>
                <ChevronRight size={16} color="#5F6067" style={{ transform: expandedId === s.id ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
              </div>
            </div>
            {expandedId === s.id && (
              <div style={{ marginTop: 10, borderTop: "1px solid #24262b", paddingTop: 10 }}>
                {groups.map((group, gi) => (
                  <div key={gi} style={{ marginBottom: 6 }}>
                    {group.subtitle && <div style={{ fontSize: 11, color: "#5F6067", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>{group.subtitle}</div>}
                    {group.items.map((e) => (
                      <div key={e.exerciseId} style={{ marginBottom: 8 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 3 }}>{e.name}</div>
                        <div style={{ fontSize: 12, color: "#8B8D94" }}>{e.sets.map((st) => `${st.weight || "-"}kg x${st.reps || "-"}`).join("  ·  ")}</div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function MiniChart({ data, onSelectPoint }) {
  const w = 280, h = 100, pad = 10;
  const values = data.map((d) => d.max);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const points = data.map((d, i) => {
    const x = pad + (i / Math.max(1, data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.max - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const path = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  return (
    <div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
        <path d={path} fill="none" stroke="#F2C14E" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {points.map((p, i) => (
          <g key={i} onClick={() => onSelectPoint && onSelectPoint(data[i].sessionId)} style={{ cursor: onSelectPoint ? "pointer" : "default" }}>
            <circle cx={p[0]} cy={p[1]} r="10" fill="transparent" />
            <circle cx={p[0]} cy={p[1]} r="3" fill="#F2C14E" />
          </g>
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#8B8D94", marginTop: 4 }}>
        <span>{formatDate(data[0].date)}</span><span>Max: {max}kg</span><span>{formatDate(data[data.length - 1].date)}</span>
      </div>
    </div>
  );
}

function SetDetailChart({ entry }) {
  const points = entry.sets.map((st, i) => ({ setNum: i + 1, weight: parseFloat(st.weight), reps: st.reps })).filter((p) => !isNaN(p.weight));
  if (points.length === 0) return <p style={{ fontSize: 13, color: "#8B8D94" }}>Nessun peso registrato per questa sessione.</p>;
  const w = 280, h = 100, pad = 10;
  const values = points.map((p) => p.weight);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const coords = points.map((p, i) => {
    const x = pad + (i / Math.max(1, points.length - 1)) * (w - pad * 2);
    const y = h - pad - ((p.weight - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const path = coords.map((c, i) => (i === 0 ? `M${c[0]},${c[1]}` : `L${c[0]},${c[1]}`)).join(" ");
  return (
    <div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
        <path d={path} fill="none" stroke="#F2C14E" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {coords.map((c, i) => <circle key={i} cx={c[0]} cy={c[1]} r="3" fill="#F2C14E" />)}
      </svg>
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "space-between", gap: "4px 8px", fontSize: 11, color: "#8B8D94", marginTop: 4 }}>
        {points.map((p, i) => <span key={i}>S{p.setNum}: {p.weight}kg{p.reps ? ` x${p.reps}` : ""}</span>)}
      </div>
    </div>
  );
}

function EmptyState({ title, body }) {
  return (
    <div style={{ textAlign: "center", padding: "50px 20px", color: "#8B8D94" }}>
      <Dumbbell size={32} color="#3a3c42" style={{ marginBottom: 12 }} />
      <div className="bn" style={{ fontSize: 20, color: "#EDEBE3", marginBottom: 6 }}>{title}</div>
      <p style={{ fontSize: 14, maxWidth: 280, margin: "0 auto" }}>{body}</p>
    </div>
  );
}

const cardStyle = { background: "#191a1e", border: "1px solid #24262b", borderRadius: 14, padding: 16 };
const inputStyle = { background: "#131417", border: "1px solid #2c2e33", borderRadius: 8, color: "#EDEBE3", padding: "9px 10px", fontSize: 14, width: "100%", boxSizing: "border-box", outline: "none" };
const primaryBtnStyle = { background: "#F2C14E", color: "#131417", border: "none", borderRadius: 8, padding: "9px 14px", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 };
const secondaryBtnStyle = { background: "#232520", color: "#F2C14E", border: "1px dashed #3a3c30", borderRadius: 8, padding: "9px 14px", fontWeight: 600, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 };
const iconBtnStyle = { background: "transparent", border: "none", cursor: "pointer", padding: 4, display: "flex", alignItems: "center", justifyContent: "center" };
const smallBtnStyle = { background: "#24262b", border: "none", borderRadius: 6, color: "#EDEBE3", padding: "5px 8px", fontSize: 12, cursor: "pointer" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
